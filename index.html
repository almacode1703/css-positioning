<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSS Positioning</title>

        <style>
            body {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
          
            .box {
                height: 50px;
                width: 50px;
                background-color: blue;
            }
            .absolute {
                position: absolute;
                top: 20px;
                left: 20px;
            }
            .relative {
                position: relative;
                top: 50px;
                left: 50px;
                background-color: magenta;
            }

            .parent {
                height: 300px;
                width: 300px;
                border: 1px solid;
                background: wheat;
                position: absolute;
                top: 100px;
                left: 100px;
            }

            .parent1 {
                height: 500px;
                width: 500px;
                background: black;
                position: relative;
                top: 300px;
                left: 700px;
            }
            .child1 {
                height: 100px;
                width: 100px;
                background-color: yellow;
                transform: translate(-50%, -50%);
                top: 50%;
                left: 50%;
                position: absolute;
            }
            .fixed{
                position : fixed;
                top:20px;
                right: 20px;
                padding: 20px;
                border: 2px solid green;
                background-color: magenta;
            }
          
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="box absolute"></div>
        </div>

        <div class="box relative"></div>

        <div class="parent1">
            <div class="child1"></div>
        </div>

        <div class="box fixed"></div>
        <div class="spacer"></div>
       
    </body>
</html>
